appId: e28208b8-89b4-4682-80dc-925059424b1f
productName: CajaGrit
directories:
  buildResources: build
  output: dist
extraMetadata:
  main: electron.js
files:
  - from: web-build
    to: web-build
  - electron.js
  - preload.js
  - package.json
  - node_modules/**/*

extraResources:
  - from: web-build
    to: web-build
  # openpay-bridge: proceso .NET local (SDK EGlobal.TotalPOS.Peru.SDK) que
  # arranca `electron.js` para el PinPad OpenPay. Se empaqueta solo si el
  # bridge fue compilado (bin/Release/openpay-bridge.exe). Requiere que la
  # DLL del SDK esté copiada en openpay-bridge/lib/ antes de compilar.
  - from: openpay-bridge/bin/Release
    to: openpay-bridge
    filter:
      - '**/*'
    # Nota: si la carpeta no existe (dev sin compilar el bridge),
    # electron-builder emite un warning pero no falla el build.

win:
  artifactName: '${productName}-${version}-installer.${ext}'
  target:
    - nsis
    - portable
  icon: assets/icon.ico

nsis:
  include: installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CajaGrit
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  displayLanguageSelector: false
  language: 1034
  installerLanguages:
    - es_ES
    - en_US
  artifactName: '${productName}-${version}-setup.${ext}'

portable:
  artifactName: '${productName}-${version}-portable.${ext}'

# Actualizaciones automáticas vía electron-updater (igual que admin-frontend-joanis).
# electron-builder genera latest.yml y `npm run publish` lo sube a GitHub Releases.
publish:
  provider: github
  owner: Aronis-web
  repo: caja-frontend-joanis
